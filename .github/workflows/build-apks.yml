name: Build CarMirror APKs (Sender + Receiver T3L 32-bit/64-bit)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Sender and Receiver (T3L) Release APKs
        run: gradle :sender:assembleRelease :receiver:assembleRelease

      - name: Upload Sender APK (Smartphone)
        uses: actions/upload-artifact@v4
        with:
          name: CarMirror-Sender-Smartphone-APK
          path: sender/build/outputs/apk/release/*.apk

      - name: Upload Receiver APK (Central Multimidia Allwinner T3L)
        uses: actions/upload-artifact@v4
        with:
          name: CarMirror-Receiver-T3L-APK
          path: receiver/build/outputs/apk/release/*.apk
